// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.version_setup_compileSdk = 28
    ext.version_setup_minSdk = 17
    ext.version_setup_targetSdk = ext.version_setup_compileSdk
    ext.version_setup_buildTools = "28.0.3"

    // https://developer.android.com/studio/releases/gradle-plugin.html
    ext.version_gradle_tools = '7.2.2'
    // https://developer.android.com/topic/libraries/support-library/revisions.html
    ext.version_library_appcompat = "28.0.0"
    // https://github.com/JakeWharton/butterknife/releases
    ext.version_library_butterknife = "8.8.1"
    // https://github.com/guardianproject/NetCipher/releases
    ext.version_library_netcipher = "2.0.0-alpha1"
    repositories {
        google()
        mavenCentral()
        maven { url 'https://maven.aliyun.com/repository/public' }

    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.2.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // JCenter is shut down (requests now redirect to Maven Central). Six dependencies
        // (percent-support-extends, arcprogressstackview, material-intro-screen,
        // recyclerview-animators 2.2.7, autostarter, xcrash) were only ever published to JCenter
        // and are still served by Aliyun's 'public' mirror (its Central + JCenter aggregate).
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url "https://jitpack.io" }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
